name: ArmorPaint Precompiled Assembler

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  assemble-windows:
    name: Assemble ArmorPaint for Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout ArmorPaint Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Output Directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows
          
          # 1. Copia a pasta de assets obrigatória do ArmorPaint
          if (Test-Path "paint\assets") {
              Copy-Item -Path "paint\assets" -Destination "dist\windows\assets" -Recurse -Force
              Write-Host "Assets copiados com sucesso."
          }

      - name: Download Official Precompiled Krom Runtime
        shell: powershell
        run: |
          Write-Host "=== Consultando a ultima release oficial do Krom ==="
          
          # 1. Consulta a API do GitHub para pegar a URL de download da última release estável do krom_bin
          # Isso ignora nomes de branches e vai direto no binário homologado
          $apiResponse = Invoke-RestMethod -Uri "https://api.github.com/repos/armory3d/krom_bin/releases/latest"
          $zipUrl = $apiResponse.zipball_url
          
          Write-Host "Baixando de: $zipUrl"
          Invoke-WebRequest -Uri $zipUrl -OutFile "krom_bin.zip"
          
          # 2. Extrai os binários na pasta temporária
          Expand-Archive -Path "krom_bin.zip" -DestinationPath "tmp_krom" -Force
          
          # 3. Localiza a pasta interna (o GitHub gera o nome baseado na tag da release) e move os arquivos do win32
          $extractedFolder = Get-ChildItem -Path "tmp_krom" -Directory | Select-Object -First 1
          $win32Path = Join-Path $extractedFolder.FullName "win32"
          
          if (Test-Path $win32Path) {
              Get-ChildItem -Path $win32Path -Filter * -File | ForEach-Object {
                  Copy-Item -Path $_.FullName -Destination "dist\windows\" -Force
                  Write-Host "Injetado componente nativo: $_.Name"
              }
          } else {
              Write-Error "Pasta 'win32' nao encontrada dentro da release baixada."
              exit 1
          }
          
          # 4. Limpa os temporários de download
          Remove-Item -Path "krom_bin.zip" -Force
          Remove-Item -Path "tmp_krom" -Recurse -Force

      - name: Standardize Executable Name
        shell: powershell
        run: |
          # O executável oficial se chama Krom.exe. Vamos renomear para ficar perfeito.
          if (Test-Path "dist\windows\Krom.exe") {
              Rename-Item -Path "dist\windows\Krom.exe" -NewName "ArmorPaint.exe" -Force
              Write-Host "Sucesso: Estrutura montada e renomeada para ArmorPaint.exe!"
          } else {
              Write-Error "Erro: O runtime Krom.exe nao foi baixado corretamente."
              exit 1
          }

      - name: Upload Functional ArmorPaint Package
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-Assembled
          path: dist/windows/
          retention-days: 7
