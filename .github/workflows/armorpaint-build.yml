name: ArmorPaint Automated Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build for Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang \
            libxinerama-dev libxrandr-dev libasound2-dev \
            libxi-dev mesa-common-dev libgl-dev libxcursor-dev \
            libvulkan-dev libgtk-3-dev libudev-dev

      - name: Generate Project and Compile
        run: |
          cd paint
          ../base/make --compile

      - name: Organize Linux Build Artifact
        run: |
          mkdir -p dist/linux
          cp -r paint/build/ArmorPaint dist/linux/ || cp -r build/ArmorPaint dist/linux/ || echo "Verifique a pasta de saída"
          cp -r paint/assets dist/linux/
          
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Linux-x64
          path: dist/linux/
          retention-days: 5

  build-windows:
    name: Build for Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate and Compile Windows Solution
        shell: cmd
        run: |
          cd paint
          
          # 1. Inicializa e atualiza os submodulos de forma forcada caso o checkout falhe em puxar algo
          git submodule update --init --recursive
          
          # 2. Roda o make baixando as dependencias nativas obrigatorias do Windows (V8 / Krom runtime)
          ..\base\make --v8
          
          if not exist build\ArmorPaint.sln (
              echo ERRO: A solucao ArmorPaint.sln nao foi gerada pelo script make!
              exit /b 1
          )
          
          # 3. Compila a solucao garantindo que trate avisos como avisos, nao erros
          msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64 /m /p:WarningLevel=2

      - name: Organize Windows Build Artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows
          
          Write-Host "=== Buscando arquivos gerados pelo compilador ==="
          
          if (Test-Path "paint\assets") {
              Copy-Item -Path "paint\assets" -Destination "dist\windows\assets" -Recurse -Force
          }
          
          # Busca em toda a árvore do projeto (incluindo subpastas e caminhos alternativos do Krom)
          Get-ChildItem -Path "paint" -Filter *.exe -Recurse | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "dist\windows\" -Force
              Write-Host "Copiado executavel: $_.Name de $_.FullName"
          }
          
          Get-ChildItem -Path "paint" -Filter *.dll -Recurse | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "dist\windows\" -Force
              Write-Host "Copiada DLL: $_.Name"
          }
          
          # Padroniza o nome do binario final
          if (Test-Path "dist\windows\Krom.exe") {
              Rename-Item -Path "dist\windows\Krom.exe" -NewName "ArmorPaint.exe" -Force
              Write-Host "Sucesso: Krom.exe encontrado e renomeado para ArmorPaint.exe!"
          } elseif (Test-Path "dist\windows\ArmorPaint.exe") {
              Write-Host "Sucesso: ArmorPaint.exe ja foi gerado com o nome correto!"
          } else {
              # Se nao achou na pasta paint, faz uma ultima varredura na raiz por desencargo
              Get-ChildItem -Path "." -Filter Krom.exe -Recurse | ForEach-Object {
                  Copy-Item -Path $_.FullName -Destination "dist\windows\ArmorPaint.exe" -Force
              }
              
              if (Test-Path "dist\windows\ArmorPaint.exe") {
                  Write-Host "Sucesso: Executavel resgatado da pasta raiz do projeto!"
              } else {
                  Write-Error "ERRO CRITICO: Nenhum executavel (.exe) foi gerada na compilacao."
                  exit 1
              }
          }

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: dist/windows/
          retention-days: 5
