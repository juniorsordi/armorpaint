name: ArmorPaint Precompiled Assembler

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  assemble-windows:
    name: Assemble ArmorPaint for Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout ArmorPaint Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Output Directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows
          
          # 1. Copia a pasta de assets obrigatória do ArmorPaint
          if (Test-Path "paint\assets") {
              Copy-Item -Path "paint\assets" -Destination "dist\windows\assets" -Recurse -Force
              Write-Host "Assets copiados com sucesso."
          }

      - name: Download Official Precompiled Krom Runtime
        shell: powershell
        run: |
          Write-Host "=== Baixando binarios oficiais do Krom ==="
          
          # Link corrigido apontando para a branch 'master' correta do repositorio
          Invoke-WebRequest -Uri "https://github.com/armory3d/krom_bin/archive/refs/heads/master.zip" -OutFile "krom_bin.zip"
          
          # Extrai os binários na pasta temporária
          Expand-Archive -Path "krom_bin.zip" -DestinationPath "tmp_krom" -Force
          
          # Move os arquivos executáveis, DLLs e componentes necessários
          # Caminho interno atualizado para refletir a branch master extraída pelo GitHub
          Get-ChildItem -Path "tmp_krom\krom_bin-master\win32" -Filter * -File | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "dist\windows\" -Force
              Write-Host "Injetado componente nativo: $_.Name"
          }
          
          # Limpa os temporários de download
          Remove-Item -Path "krom_bin.zip" -Force
          Remove-Item -Path "tmp_krom" -Recurse -Force

      - name: Standardize Executable Name
        shell: powershell
        run: |
          # O executável oficial se chama Krom.exe. Vamos renomear para ficar perfeito.
          if (Test-Path "dist\windows\Krom.exe") {
              Rename-Item -Path "dist\windows\Krom.exe" -NewName "ArmorPaint.exe" -Force
              Write-Host "Sucesso: Estrutura montada e renomeada para ArmorPaint.exe!"
          } else {
              Write-Error "Erro: O runtime Krom.exe nao foi baixado corretamente."
              exit 1
          }

      - name: Upload Functional ArmorPaint Package
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-Assembled
          path: dist/windows/
          retention-days: 7
