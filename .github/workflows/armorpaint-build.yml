name: ArmorPaint Automated Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build for Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang \
            libxinerama-dev libxrandr-dev libasound2-dev \
            libxi-dev mesa-common-dev libgl-dev libxcursor-dev \
            libvulkan-dev libgtk-3-dev libudev-dev

      - name: Generate Project and Compile
        run: |
          cd paint
          ../base/make --compile

      - name: Organize Linux Build Artifact
        run: |
          mkdir -p dist/linux
          cp -r paint/build/ArmorPaint dist/linux/ || cp -r build/ArmorPaint dist/linux/ || echo "Verifique a pasta de saída"
          cp -r paint/assets dist/linux/
          
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Linux-x64
          path: dist/linux/
          retention-days: 5

  build-windows:
    name: Build for Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate and Compile Windows Solution
        shell: cmd
        run: |
          cd paint
          ..\base\make
          if not exist build\ArmorPaint.sln (
              echo ERRO: A solucao ArmorPaint.sln nao foi gerada pelo script make!
              exit /b 1
          )
          msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Organize Windows Build Artifact
        shell: cmd
        run: |
          mkdir dist\windows
          
          echo === Buscando arquivos gerados pelo compilador ===
          
          # 1. Copia a pasta obrigatória de assets
          xcopy /E /I paint\assets dist\windows\assets
          
          # 2. Busca e copia qualquer arquivo .exe gerado dentro de paint\build
          for /R paint\build %%I in (*.exe) do (
              copy "%%I" dist\windows\
          )
          
          # 3. Busca e copia qualquer arquivo .dll (dependencias) gerado dentro de paint\build
          for /R paint\build %%I in (*.dll) do (
              copy "%%I" dist\windows\
          )
          
          # 4. Padroniza o executável final
          if exist dist\windows\Krom.exe (
              ren dist\windows\Krom.exe ArmorPaint.exe
              echo Sucesso: Krom.exe encontrado e renomeado para ArmorPaint.exe!
          ) else if exist dist\windows\ArmorPaint.exe (
              echo Sucesso: ArmorPaint.exe ja foi gerado com o nome correto!
          ) else (
              echo ERRO CRITICO: Nenhum executavel (.exe) foi encontrado na pasta paint\build. O MSBuild pode ter falhado silenciosamente.
              exit /b 1
          )

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: dist/windows/
          retention-days: 5
