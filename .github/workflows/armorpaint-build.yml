name: Build ArmorPaint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # LINUX (x64) — caminho mais confiável: compila com um único comando headless.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build ArmorPaint (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ArmorPaint source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make clang \
            libvulkan-dev libgtk-3-dev libssl-dev \
            libxi-dev libxrandr-dev libxcursor-dev

      - name: Compile
        working-directory: paint
        run: ../base/make --compile   # --compile = build headless (NAO usar --run em CI)

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Linux-x64
          path: paint/build            # estreite depois de ver o layout real
          retention-days: 7

  # ---------------------------------------------------------------------------
  # WINDOWS (x64)
  #   Causa do MSB1009 anterior: '..\base\make' e resolvido via make.bat, mas o
  #   shell padrao do Actions no Windows e PowerShell, que nao resolve o caminho
  #   relativo sem extensao -> o make "passa" sem gerar o .sln.
  #   Correcoes: rodar o make em `shell: cmd` + localizar o .sln dinamicamente.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build ArmorPaint (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout ArmorPaint source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio project
        working-directory: paint
        shell: cmd
        run: ..\base\make

      - name: Locate generated solution
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path paint -Recurse -Filter *.sln | Select-Object -First 1
          if (-not $sln) {
            Write-Host "== Conteudo de paint\build (se existir) =="
            if (Test-Path paint\build) { Get-ChildItem -Path paint\build -Recurse | Select-Object FullName }
            Write-Error "Nenhum .sln foi gerado pelo make. Veja o log do passo anterior."
            exit 1
          }
          Write-Host "SLN encontrado: $($sln.FullName)"
          "SLN_PATH=$($sln.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build solution (x64 / Release)
        shell: pwsh
        run: msbuild "$env:SLN_PATH" /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: paint/build
          retention-days: 7
