name: ArmorPaint Automated Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build for Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang \
            libxinerama-dev libxrandr-dev libasound2-dev \
            libxi-dev mesa-common-dev libgl-dev libxcursor-dev \
            libvulkan-dev libgtk-3-dev libudev-dev

      - name: Generate Project and Compile
        run: |
          cd paint
          ../base/make --compile

      - name: Organize Linux Build Artifact
        run: |
          mkdir -p dist/linux
          cp -r paint/build/ArmorPaint dist/linux/ || cp -r build/ArmorPaint dist/linux/ || echo "Verifique a pasta de saída"
          cp -r paint/assets dist/linux/
          
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Linux-x64
          path: dist/linux/
          retention-days: 5

  build-windows:
    name: Build for Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate and Compile Windows Solution
        shell: cmd
        run: |
          cd paint
          ..\base\make
          
          # Checa dinamicamente se foi gerado o formato novo (.slnx) ou o antigo (.sln)
          if exist build\ArmorPaint.slnx (
              echo Sucesso: Detectada solucao moderna .slnx
              msbuild build\ArmorPaint.slnx /p:Configuration=Release /p:Platform=x64 /m
          ) else if exist build\ArmorPaint.sln (
              echo Sucesso: Detectada solucao classica .sln
              msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64 /m
          ) else (
              echo ERRO: Nao foi encontrado nenhum arquivo de solucao em paint\build\
              exit /b 1
          )

      - name: Organize Windows Build Artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows
          
          Write-Host "=== Buscando arquivos gerados pelo compilador ==="
          
          # 1. Copia a pasta obrigatória de assets
          if (Test-Path "paint\assets") {
              Copy-Item -Path "paint\assets" -Destination "dist\windows\assets" -Recurse -Force
          }
          
          # 2. Varre recursivamente a pasta paint para pescar o executável e as DLLs geradas
          Get-ChildItem -Path "paint" -Filter *.exe -Recurse | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "dist\windows\" -Force
              Write-Host "Copiado executavel: $_.Name"
          }
          
          Get-ChildItem -Path "paint" -Filter *.dll -Recurse | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "dist\windows\" -Force
              Write-Host "Copiada DLL: $_.Name"
          }
          
          # 3. Renomeia o executável do motor (Krom.exe) para o nome final
          if (Test-Path "dist\windows\Krom.exe") {
              Rename-Item -Path "dist\windows\Krom.exe" -NewName "ArmorPaint.exe" -Force
              Write-Host "Sucesso: Krom.exe encontrado e renomeado para ArmorPaint.exe!"
          } elseif (Test-Path "dist\windows\ArmorPaint.exe") {
              Write-Host "Sucesso: ArmorPaint.exe ja foi gerado com o nome correto!"
          } else {
              Write-Error "ERRO CRITICO: A compilacao terminou, mas nenhum .exe foi encontrado na pasta do projeto."
              exit 1
          }

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: dist/windows/
          retention-days: 5
