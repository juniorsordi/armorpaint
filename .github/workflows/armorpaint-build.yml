name: Build ArmorPaint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # LINUX (x64) — caminho mais confiável para CI: compila com um único comando.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build ArmorPaint (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ArmorPaint source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make clang \
            libvulkan-dev libgtk-3-dev libssl-dev \
            libxi-dev libxrandr-dev libxcursor-dev

      - name: Compile
        working-directory: paint
        run: ../base/make --compile   # --compile = build headless (NÃO usar --run em CI)

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Linux-x64
          path: paint/build            # ajuste depois de ver o layout real da pasta
          retention-days: 7

  # ---------------------------------------------------------------------------
  # WINDOWS (x64) — funcional, mas com ressalvas (ver mensagem). O make gera um
  # .sln e a compilação é feita via MSBuild. Requer toolset clang (clang-cl).
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build ArmorPaint (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout ArmorPaint source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio project
        working-directory: paint
        run: ..\base\make

      - name: Build solution (x64 / Release)
        working-directory: paint
        run: msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: paint\build\x64\Release  # caminho provável; confirme na primeira execução
          retention-days: 7
